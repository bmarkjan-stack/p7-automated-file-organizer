name: Build and Release

# Runs whenever a version tag (v1.0.0, v2.1.3, etc.) is pushed.
# Builds FileOrganizer.exe on a Windows runner, signs it, and attaches it
# to a new GitHub Release for that tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build FileOrganizer.exe
        run: pyinstaller build_scripts/organizer.spec --distpath dist --workpath build_scripts/work --noconfirm

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/FileOrganizer.exe || (echo "Build did not produce dist/FileOrganizer.exe" && exit 1)

      - name: Prepare code-signing certificate
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_BASE64)) {
            throw "CODESIGN_PFX_BASE64 secret is missing."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "codesigning.pfx"

          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64)
          )

          Write-Host "Code-signing certificate prepared."

      - name: Sign FileOrganizer.exe
        shell: pwsh
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_PASSWORD)) {
            throw "CODESIGN_PFX_PASSWORD secret is missing."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "codesigning.pfx"

          $signTool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" `
            -Recurse `
            -ErrorAction Stop |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signTool) {
            throw "x64 SignTool was not found on the GitHub Actions runner."
          }

          Write-Host "Using SignTool: $($signTool.FullName)"

          & $signTool.FullName sign `
            /f $pfxPath `
            /p $env:CODESIGN_PFX_PASSWORD `
            /fd SHA256 `
            "$env:GITHUB_WORKSPACE\dist\FileOrganizer.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed with exit code $LASTEXITCODE."
          }

          Write-Host "FileOrganizer.exe was successfully signed."

      - name: Verify code signature
        shell: pwsh
        run: |
          $exePath = "$env:GITHUB_WORKSPACE\dist\FileOrganizer.exe"

          $signature = Get-AuthenticodeSignature $exePath

          Write-Host "Signature type: $($signature.SignatureType)"
          Write-Host "Status: $($signature.Status)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($signature.SignerCertificate.Thumbprint)"

          if ($signature.SignatureType -ne "Authenticode") {
            throw "FileOrganizer.exe does not contain an Authenticode signature."
          }

          if (-not $signature.SignerCertificate) {
            throw "No signer certificate was found."
          }

          if ($signature.SignerCertificate.Thumbprint -ne "8D0BB478D456ED9EB698C4C388CCE67FC14E0270") {
            throw "The EXE was signed with an unexpected certificate."
          }

          Write-Host "Authenticode signature verified."

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesigning.pfx"

          if (Test-Path $pfxPath) {
            Remove-Item $pfxPath -Force
            Write-Host "Temporary PFX removed."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FileOrganizer.exe
          generate_release_notes: true